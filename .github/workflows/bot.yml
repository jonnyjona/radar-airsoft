name: Radar Airsoft (bot de Telegram)

on:
  schedule:
    - cron: "*/10 * * * *"   # mira los mensajes cada 10 minutos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -q -r requirements.txt

      - name: Descargar datos guardados
        run: bash scripts/data-pull.sh

      - name: Responder mensajes
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u scraper/radar.py bot data
