name: Radar Airsoft (tiendas)

on:
  schedule:
    - cron: "17 */2 * * *"   # cada 2 horas (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scraper/**", ".github/workflows/radar.yml"]

permissions:
  contents: write

concurrency:
  group: radar-catalog
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -q -r requirements.txt

      - name: Descargar datos guardados
        run: bash scripts/data-pull.sh

      - name: Leer tiendas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          python -u scraper/radar.py catalog data 2>&1 | tee data/last-run.log

      - name: Guardar datos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/data-push.sh
